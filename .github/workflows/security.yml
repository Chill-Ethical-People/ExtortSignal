name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83'
      - name: Install project and audit tooling
        run: python -m pip install -e './backend[dev]' 'pip-audit>=2.9,<3'
      - name: Run security-focused static analysis
        run: python -m ruff check --select S backend/ransom_monitor
      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable

  frontend:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install --global pnpm@10.13.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  snyk:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Explain skipped Snyk scan
        if: env.SNYK_TOKEN == ''
        run: echo 'Snyk is skipped until the SNYK_TOKEN repository secret is configured.'
      - uses: actions/checkout@v7
        if: env.SNYK_TOKEN != ''
      - uses: actions/setup-python@v6
        if: env.SNYK_TOKEN != ''
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 20
      - name: Install scan dependencies
        if: env.SNYK_TOKEN != ''
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          python -m pip install -r backend/requirements.txt
          npm install --global pnpm@10.13.1 snyk@1.1306.1
          pnpm --dir frontend install --frozen-lockfile
      - name: Test Python dependencies with Snyk
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=backend/requirements.txt --package-manager=pip --command=python3 --severity-threshold=high --fail-on=all
      - name: Test frontend dependencies with Snyk
        if: env.SNYK_TOKEN != ''
        working-directory: frontend
        run: snyk test --file=package.json --severity-threshold=high --fail-on=all
