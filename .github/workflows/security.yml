name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade 'pip>=26.1.2' 'setuptools>=83'
      - name: Install project and audit tooling
        run: python -m pip install -e './backend[dev]' 'pip-audit>=2.9,<3'
      - name: Run security-focused static analysis
        run: python -m ruff check --select S backend/ransom_monitor
      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable

  frontend:
    name: Frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install --global pnpm@10.13.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
